    <!-- Early Error Guard for Cross-Origin Script Errors in Sandboxed Environments -->
    <script>
      (function() {
        function suppressCrossOriginError(e) {
          var msg = e ? (e.message || e.reason) : '';
          var msgStr = typeof msg === 'string' ? msg : (msg && msg.message ? msg.message : '');
          if (!msgStr || msgStr === "Script error." || msgStr === "Script error" || msgStr.indexOf("Script error") !== -1 || (!e.filename && !e.lineno && !e.error)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }
        window.onerror = function(msg, url, line, col, error) {
          if (!msg || msg === "Script error." || msg === "Script error" || (!url && !line)) {
            return true;
          }
        };
        window.addEventListener('error', suppressCrossOriginError, true);
        window.addEventListener('unhandledrejection', suppressCrossOriginError, true);
      })();
    </script>

    <!-- Service Worker Registration & PWA Update Handler -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          try {
            var isIframe = window.self !== window.top;
            if (isIframe) {
              console.log('Skipping Service Worker registration inside sandboxed iframe preview.');
              return;
            }

            // updateViaCache: 'none' tells the browser to ALWAYS re-fetch /sw.js
            // via HTTP (bypassing the browser's own SW script cache). Without this,
            // the browser may serve a cached copy of sw.js and the byte-diff check
            // never detects a new version — meaning update checks silently fail.
            navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
              .then((reg) => {
                window.__swRegistration = reg;
                window.dispatchEvent(new CustomEvent('sw-registered', { detail: reg }));
                console.log('Phantom Chat Service Worker registered:', reg.scope);

                // If a new worker is already waiting (e.g. installed in a previous tab),
                // surface the update prompt immediately.
                if (reg.waiting) {
                  window.dispatchEvent(new CustomEvent('sw-update-waiting', { detail: reg }));
                }

                // Watch for a new worker entering the installing -> installed lifecycle.
                reg.addEventListener('updatefound', () => {
                  var newWorker = reg.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', () => {
                      // 'installed' + an existing controller means there is a waiting worker
                      // ready to take over on the next navigation or SKIP_WAITING signal.
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.dispatchEvent(new CustomEvent('sw-update-waiting', { detail: reg }));
                      }
                    });
                  }
                });

                // Trigger an explicit update check 3 s after initial load so that a newly
                // deployed sw.js is detected on first visit after a deploy, not just after
                // the browser's 24-hour background update interval.
                setTimeout(function() {
                  reg.update().catch(function() {});
                }, 3000);

                // Also re-check whenever the user returns to the tab / foreground.
                document.addEventListener('visibilitychange', function() {
                  if (document.visibilityState === 'visible') {
                    reg.update().catch(function() {});
                  }
                });
              })
              .catch((err) => console.warn('Service Worker registration skipped:', err));
          } catch (e) {
            console.warn('Service Worker registration exception:', e);
          }
        });
      }
    </script>
